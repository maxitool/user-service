version: '3.8'

services:
  # === ПЕРВЫЙ БРОКЕР (ЛИДЕР КВОРУМА / КОНТРОЛЛЕР) ===
  kafka-1:
    image: apache/kafka:3.7.0
    container_name: kafka-1
    # Открываем порт 9092 на вашем компьютере для подключения из Java
    ports:
      - "9092:9092"
    environment:
      # Уникальный ID этого брокера в кластере
      KAFKA_NODE_ID: 1
      # Этот узел совмещает роли брокера (хранит данные) и контроллера (управляет кластером)
      KAFKA_PROCESS_ROLES: 'broker,controller'
      # Внутренние порты контейнера: 9092 для клиентов, 9093 для общения контроллеров, 9094 для общения брокеров
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,CLUSTER://:9094'
      # Адрес, который брокер вернет вашему Java-приложению. Java будет подключаться на localhost:9092
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,CLUSTER://kafka-1:9094'
      # Указываем, что для связи контроллеров используется слушатель с именем CONTROLLER
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      # Карта протоколов безопасности (везде PLAINTEXT — без шифрования для тестов)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,CLUSTER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      # Полный список всех контроллеров в кластере. Они голосуют за выбор главного.
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      # Имя слушателя, который брокеры используют для пересылки данных между собой
      KAFKA_INTER_BROKER_LISTENER_NAME: 'CLUSTER'

      # --- НАСТРОЙКИ ОТКАЗОУСТОЙЧИВОСТИ ---
      # Фактор репликации по умолчанию. Теперь каждое сообщение дублируется на все 3 брокера!
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      # Сколько партиций (разделов) создавать для новых топиков по умолчанию
      KAFKA_NUM_PARTITIONS: 3
      # Системный топик смещений теперь тоже дублируется на 3 узла
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      # Тот самый параметр! Для успешной записи транзакции нужно подтверждение минимум от 2-х синхронных брокеров (Лидер + 1 Живой Резерв)
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      # Лог транзакций дублируется на все 3 брокера
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3

      # Разрешаем Java-приложению автоматически создавать топики при первой отправке
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      # Уровень логирования в консоль
      KAFKA_LOG4J_ROOT_LOGLEVEL: 'INFO'
    restart: always

  # === ВТОРОЙ БРОКЕР (РЕЗЕРВНЫЙ) ===
  kafka-2:
    image: apache/kafka:3.7.0
    container_name: kafka-2
    # Для второго брокера пробрасываем на компьютер порт 9095, чтобы не было конфликта с портoм 9092
    ports:
      - "9095:9095"
    environment:
      # Уникальный ID для второго узла
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9095,CONTROLLER://:9093,CLUSTER://:9094'
      # Java-приложение сможет достучаться до этого брокера по адресу localhost:9095
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9095,CLUSTER://kafka-2:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,CLUSTER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      # Список контроллеров точно такой же, как на первом брокере
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'CLUSTER'

      # Параметры кластера должны совпадать на всех узлах
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG4J_ROOT_LOGLEVEL: 'INFO'
    restart: always

  # === ТРЕТИЙ БРОКЕР (РЕЗЕРВНЫЙ) ===
  kafka-3:
    image: apache/kafka:3.7.0
    container_name: kafka-3
    # Пробрасываем на компьютер порт 9096
    ports:
      - "9096:9096"
    environment:
      # Уникальный ID для третьего узла
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://:9096,CONTROLLER://:9093,CLUSTER://:9094'
      # Java-приложение сможет достучаться до этого брокера по адресу localhost:9096
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9096,CLUSTER://kafka-3:9094'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,CLUSTER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'CLUSTER'

      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG4J_ROOT_LOGLEVEL: 'INFO'
    restart: always
