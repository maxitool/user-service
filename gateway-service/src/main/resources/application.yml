server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 3s

      server:
        webflux:
          trusted-proxies: ".*"
          x-forwarded:
            host-enabled: true
            proto-enabled: true
            port-enabled: true
            prefix-enabled: true

          routes:
            - id: user_service_v3_docs
              uri: lb://user-service
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service, /v3/api-docs

            - id: user_service_route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: userEurekaCircuitBreaker
                - name: Retry
                  args:
                    retries: 2
                    statuses:
                      - INTERNAL_SERVER_ERROR
                      - SERVICE_UNAVAILABLE
                      - GATEWAY_TIMEOUT
                    exceptions:
                      - java.util.concurrent.TimeoutException
                      - io.netty.handler.timeout.ReadTimeoutException
                      - io.netty.channel.ConnectTimeoutException
                    methods:
                      - GET
                      - POST
                      - DELETE
                      - PUT

            - id: notification_service_route
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/email/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: "*"
                allowedHeaders: "*"
                allowCredentials: true

resilience4j:
  timelimiter:
    instances:
      userEurekaCircuitBreaker:
        timeoutDuration: 4s
  circuitbreaker:
    instances:
      userEurekaCircuitBreaker:
        slidingWindowSize: 2
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000ms

management:
  endpoints:
    web:
      exposure:
        include: health, circuitbreakers
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls:
      - name: user-service
        url: /v3/api-docs/user-service

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    prefer-ip-address: true
