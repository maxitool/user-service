server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: shared_file_logs
    static_configs:
      - targets: [localhost]
        labels:
          job: app-logs
          __path__: /var/log/shared-apps/common.log

    pipeline_stages:
      - json:
          expressions:
            extracted_level: level
            extracted_service: service
      - labels:
          level: extracted_level
          service: extracted_service