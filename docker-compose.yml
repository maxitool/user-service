services:
  config-service:
    build:
      context: .
      dockerfile: ./config-service/Dockerfile
    ports:
      - "8888:8888"
    env_file:
      - config/common.env
      - config/git_config.env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  discovery-service:
    build:
      context: .
      dockerfile: ./discovery-service/Dockerfile
    ports:
      - "8761:8761"
    env_file:
      - config/common.env
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway-service:
    build:
      context: .
      dockerfile: ./gateway-service/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - config/common.env
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      notification-service-1:
        condition: service_healthy
      notification-service-2:
        condition: service_healthy
      user-service-1:
        condition: service_healthy
      user-service-2:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - LOGGING_FILE_NAME=/app/shared-logs/common.log
    volumes:
      - shared-logs:/app/shared-logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service-1:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - config/common.env
      - config/user_common.env
      - config/user_1.env
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      notification-service-1:
        condition: service_healthy
      notification-service-2:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - LOGGING_FILE_NAME=/app/shared-logs/common.log
    volumes:
      - shared-logs:/app/shared-logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  user-service-2:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - config/common.env
      - config/user_common.env
      - config/user_2.env
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      notification-service-1:
        condition: service_healthy
      notification-service-2:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - LOGGING_FILE_NAME=/app/shared-logs/common.log
    volumes:
      - shared-logs:/app/shared-logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service-1:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    ports:
      - "8083:8083"
    env_file:
      - config/common.env
      - config/notification_common.env
      - config/notification_1.env
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - LOGGING_FILE_NAME=/app/shared-logs/common.log
    volumes:
      - shared-logs:/app/shared-logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8083/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  notification-service-2:
    build:
      context: .
      dockerfile: ./notification-service/Dockerfile
    ports:
      - "8084:8084"
    env_file:
      - config/common.env
      - config/notification_common.env
      - config/notification_2.env
    depends_on:
      config-service:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP-SERVERS=kafka:9092
      - LOGGING_FILE_NAME=/app/shared-logs/common.log
    volumes:
      - shared-logs:/app/shared-logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8084/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8070:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  shared-logs: